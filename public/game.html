<!doctype html>
<html>
  <body>
    <style>
      body {
        margin: 0;
      }
    </style>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
      const socket = io();

      const scene = new THREE.Scene();
      const renderer = new THREE.WebGLRenderer();
      renderer.setSize(window.innerWidth, window.innerHeight);

      document.body.appendChild(renderer.domElement);

      const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000,
      );
      camera.position.z = 5;

      //create a cube
      const box = new THREE.BoxGeometry(1, 1, 1);
      const surface = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
      const mesh = new THREE.Mesh(box, surface);

      scene.add(mesh);

      let gammaOffset = 0;
      let betaOffset = 0;
      let latestGamma = 0;
      let latestBeta = 0;

      function calibrate() {
        gammaOffset = latestGamma;
        betaOffset = latestAlpha;
      }
      socket.on("calibrate", () => {
        calibrate();
      });
      //Loop
      function animate() {
        requestAnimationFrame(animate);

        //check phone orientation and update cube pos in camera
        socket.on("orientation", (data) => {
          latestGamma = data.gamma;
          latestBeta = data.beta;
          mesh.position.x = Math.max(-3, Math.min(3, data.gamma - gammaOffset));
          mesh.position.y = Math.max(
            -3,
            Math.min(3, -(data.beta - betaOffset)),
          ); // up/dow (phone tilt)
        });

        //render cube
        renderer.render(scene, camera);
      }
      animate();
    </script>
  </body>
</html>
