<!doctype html>
<html>
  <head>
    <title>Web Cricket</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        overflow: hidden;
      }

      canvas {
        display: block;
      }

      /* Main Menu Overlay */
      #menuContainer {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 20px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        z-index: 100;
      }

      #menuContainer h1 {
        color: white;
        font-size: 3rem;
        margin-bottom: 20px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
      }

      #menuContainer button {
        padding: 15px 40px;
        font-size: 1.2rem;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        background: white;
        color: #667eea;
        font-weight: bold;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      }

      #menuContainer button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
      }

      /* Gameplay HUD */
      #hudContainer {
        position: absolute;
        top: 20px;
        left: 20px;
        display: flex;
        gap: 20px;
        font-family: "Arial Black", sans-serif;
        color: #fff;
        font-size: 24px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        pointer-events: none;
        z-index: 10;
      }

      /* Shot Banner Overlay */
      #overlay {
        position: absolute;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center; /* NEW */
        font-family: "Arial Black", sans-serif;
        font-size: 72px;
        color: #ffd700;
        text-shadow: 0 0 20px rgba(0, 0, 0, 0.9);
        transition:
          opacity 0.4s ease,
          transform 0.4s ease;
        pointer-events: none;
        z-index: 20;
      }

      /* Utility class for hiding overlays */
      .hidden {
        display: none !important;
        opacity: 0;
      }

      /* Game Over Modal */
      #gameOverModal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 15px;
        background: rgba(0, 0, 0, 0.85);
        z-index: 200;
        color: white;
      }

      #gameOverModal h1 {
        font-size: 3.5rem;
        color: #ff4757;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
      }

      #gameOverModal p {
        font-size: 1.2rem;
      }

      #gameOverModal button {
        padding: 15px 40px;
        font-size: 1.2rem;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        background: #2ed573;
        color: white;
        font-weight: bold;
        transition: transform 0.2s;
        margin-top: 10px;
      }

      #gameOverModal button:hover {
        transform: scale(1.05);
      }
    </style>
  </head>
  <body>
    <!-- Main Menu -->
    <div id="menuContainer">
      <h1>🏏 Web Cricket</h1>
      <button id="startBtn">Start Game</button>
      <button id="calibrateBtn">Calibrate</button>
      <button id="quitBtn">Quit</button>
    </div>

    <!-- Gameplay HUD -->
    <div id="hudContainer">
      <div class="hud-item">
        <span class="hud-label">RUNS:</span> <span id="hud-runs">0</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">BALLS:</span> <span id="hud-balls">0</span>
      </div>
    </div>

    <!-- Shot Result Overlay -->
    <div id="overlay" class="hidden">
      <h1 id="overlay-text">4</h1>
    </div>

    <!-- Game Over Modal -->
    <div id="gameOverModal" class="hidden">
      <h1>BOWLED!</h1>
      <p>You missed the ball and your stumps were hit.</p>
      <p>Score: <span id="finalScore">0</span></p>
      <p>Balls Faced: <span id="ballsFaced">0</span></p>
      <button id="restartBtn">Play Again</button>
      <button id="exitBtn">Exit</button>
    </div>

    <!-- Scripts -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
