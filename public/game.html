<!doctype html>
<html>
  <body>
    <style>
      body {
        margin: 0;
      }
    </style>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
      const socket = io();

      const scene = new THREE.Scene();
      const renderer = new THREE.WebGLRenderer();
      renderer.setSize(window.innerWidth, window.innerHeight);

      document.body.appendChild(renderer.domElement);

      const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000,
      );
      camera.position.z = 5;

      const box = new THREE.BoxGeometry(1, 1, 1);
      const surface = new THREE.MeshBasicMaterial({ color: 0x00ff00 });

      const mesh = new THREE.Mesh(box, surface);

      scene.add(mesh);

      //Loop
      function animate() {
        requestAnimationFrame(animate);

        //check phone orientation and update cube pos
        socket.on("orientation", (data) => {
          mesh.position.x += data.gamma / 1000;
          mesh.positoin.y += data.beta / 1000;
          mesh.position.z += data.alpha / 1;
        });

        //render
        renderer.render(scene, camera);
      }
      animate();
    </script>
  </body>
</html>
