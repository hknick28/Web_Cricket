<!doctype html>
<html>
  <head>
    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();

      // event listener
      function startSensors() {
        window.addEventListener("deviceorientation", (event) => {
          document.getElementById("output").innerHTML =
            "alpha: " +
            event.alpha +
            " beta: " +
            event.beta +
            " gamma: " +
            event.gamma;

          socket.emit("orientation", {
            alpha: event.alpha,
            beta: event.beta,
            gamma: event.gamma,
          });
        });
      }
    </script>
  </head>

  <body>
    // user interface
    <h1>Cricket Conterller</h1>
    <button onclick="startSensors()">Start</button>
    <div id="output">Waiting for sensor...</div>
  </body>
</html>
