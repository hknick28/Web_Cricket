<!doctype html>
<html>
  <head>
    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();

      let isSwinging = false;

      // event listener
      function startSensors() {
        window.addEventListener("deviceorientation", (event) => {
          document.getElementById("output").innerHTML =
            "alpha: " +
            event.alpha +
            " beta: " +
            event.beta +
            " gamma: " +
            event.gamma;

          socket.emit("orientation", {
            alpha: event.alpha,
            beta: event.beta,
            gamma: event.gamma,
          });
        });

        let isSwinging = false;
        let swingSamples = [];

        window.addEventListener("devicemotion", (event) => {
          let x = event.acceleration.x;
          let y = event.acceleration.y;
          let z = event.acceleration.z;

          let acc = Math.sqrt(x ** 2 + y ** 2 + z ** 2);

          document.getElementById("acceleration").innerHTML =
            "Total Acceleration: " + acc.toFixed(2);

          // If already collecting a swing, keep adding samples
          if (isSwinging) {
            swingSamples.push(acc);
            return;
          }

          // Threshold crossed — start collecting
          if (acc < 20) return;

          isSwinging = true;
          swingSamples = [acc]; // include this first spike

          setTimeout(() => {
            // Swing window is over — find the peak and send it
            const peakBatspeed = Math.max(...swingSamples);

            socket.emit("swing", {
              batAcceleration: peakBatspeed,
            });

            swingSamples = [];
            isSwinging = false;
          }, 100); // 100ms collection window
        });
      }

      //calibrate default gamma and beta values for batting
      function calibrate() {
        socket.emit("calibrate");
      }
    </script>
  </head>

  <body>
    <h1>Conteroller</h1>
    <button onclick="startSensors()">Start</button>
    <button onClick="calibrate()">calibrate</button>
    <div id="output">Waiting for sensor...</div>
    <div id="acceleration">Acceleration: Waiting...</div>
  </body>
</html>
