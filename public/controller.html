<!doctype html>
<html>
  <head>
    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();

      let latestOrientation = { alpha: 0, beta: 0, gamma: 0 };
      let idleOrientationBuffer = [];

      let isSwinging = false;
      let swingSamples = [];
      let sensorsStarted = false;

      const SWING_COLLECTION_MS = 100;
      const SWING_COOLDOWN_MS = 400;
      let inCoolDown = false;

      function startSensors() {
        if (sensorsStarted) return;
        sensorsStarted = true;

        window.addEventListener("deviceorientation", (event) => {
          latestOrientation = {
            alpha: event.alpha || 0,
            beta: event.beta || 0,
            gamma: event.gamma || 0,
          };

          // Store pre-swing stance orientations in a ring buffer
          if (!isSwinging) {
            idleOrientationBuffer.push({ ...latestOrientation });
            if (idleOrientationBuffer.length > 10) {
              idleOrientationBuffer.shift();
            }
          }

          document.getElementById("output").innerHTML =
            "alpha: " +
            latestOrientation.alpha.toFixed(1) +
            " beta: " +
            latestOrientation.beta.toFixed(1) +
            " gamma: " +
            latestOrientation.gamma.toFixed(1);

          // Continuously stream orientation so the 3D bat mirrors the phone face live
          socket.emit("orientation", latestOrientation);
        });
      }

      window.addEventListener("devicemotion", (event) => {
        let x = event.acceleration.x || 0;
        let y = event.acceleration.y || 0;
        let z = event.acceleration.z || 0;
        let acc = Math.sqrt(x ** 2 + y ** 2 + z ** 2);

        document.getElementById("acceleration").innerHTML =
          "Total Acceleration: " + acc.toFixed(2);

        if (isSwinging) {
          swingSamples.push({ acc, orientation: { ...latestOrientation } });
          return;
        }

        if (inCoolDown || acc < 20) return;

        isSwinging = true;

        // Grab the baseline pose right before the acceleration spike occurred
        const preSwingBaseline =
          idleOrientationBuffer.length > 0
            ? idleOrientationBuffer[0]
            : { ...latestOrientation };

        swingSamples = [{ acc, orientation: { ...latestOrientation } }];

        setTimeout(() => {
          // Find sample when acceleration is at its peak
          const peakSample = swingSamples.reduce((max, s) =>
            s.acc > max.acc ? s : max,
          );

          // Calculate relative yaw (alpha) deviation from pre-swing stance
          let rawDeltaAlpha =
            peakSample.orientation.alpha - preSwingBaseline.alpha;

          rawDeltaAlpha += 36; //neutralie wrist lokcing at impact
          let deltaAlpha = ((rawDeltaAlpha + 180) % 360) - 180;

          // Calculate relative pitch (beta) deviation from pre-swing stance
          let rawDeltaBeta =
            peakSample.orientation.beta - preSwingBaseline.beta;
          let deltaBeta = ((rawDeltaBeta + 180) % 360) - 180;

          // Calculate relative roll (gamma) deviation
          let deltaGamma =
            peakSample.orientation.gamma - preSwingBaseline.gamma;

          // Send impulse trigger along with relative orientation snapshot at impact
          socket.emit("swing", {
            batAcceleration: peakSample.acc,
            impactOrientation: {
              alpha: deltaAlpha,
              beta: deltaBeta,
              gamma: deltaGamma,
            },
          });

          swingSamples = [];
          isSwinging = false;

          inCoolDown = true;
          setTimeout(() => {
            inCoolDown = false;
          }, SWING_COOLDOWN_MS);
        }, SWING_COLLECTION_MS);
      });

      function calibrate() {
        socket.emit("calibrate");
      }
    </script>
  </head>

  <body>
    <h1>Controller</h1>
    <button onclick="startSensors()">Start</button>
    <button onclick="calibrate()">Calibrate Offsets</button>
    <div id="output">Waiting for sensor...</div>
    <div id="acceleration">Acceleration: Waiting...</div>
  </body>
</html>
